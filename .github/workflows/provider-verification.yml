# =============================================================================
# AI Provider Verification - Reusable Workflow
# =============================================================================
#
# Called by provider repos to:
#   1. Fetch pacts from Pactflow
#   2. Analyze provider code
#   3. AI-generate state handlers
#   4. Run provider verification
#   5. Publish results to Pactflow
#
# provider_name resolution (AD-4):
#   - Webhook trigger: thin caller passes `client_payload.provider_name` (authoritative)
#   - Label/push trigger: thin caller passes empty → "Resolve Provider Name" step reads
#     .contract-testing.yml from the checked-out provider repo
#   - Last resort: derive from repo name
#
# =============================================================================

name: AI Provider Verification

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository in owner/repo format'
        required: true
        type: string
      pr_number:
        description: 'Pull Request number (if triggered by PR)'
        required: false
        type: number
        default: 0
      provider_name:
        description: 'Provider name as registered in Pactflow (empty = read from .contract-testing.yml)'
        required: false
        type: string
        default: ''
      pact_url:
        description: 'Specific pact URL (from webhook)'
        required: false
        type: string
        default: ''
    secrets:
      GEMINI_API_KEY:
        required: true
      PACTFLOW_TOKEN:
        required: true
      PACTFLOW_BASE_URL:
        required: true
      PAT_TOKEN:
        required: true
      LANGFUSE_PUBLIC_KEY:
        required: false
      LANGFUSE_SECRET_KEY:
        required: false
    outputs:
      verification_passed:
        description: 'Whether provider verification passed (true/false)'
        value: ${{ jobs.run-verification.outputs.verification_passed }}

jobs:
  # =====================================================================
  # STEP 1: Generate Provider Tests with AI
  # =====================================================================
  generate-provider-tests:
    name: AI Generate State Handlers
    runs-on: ubuntu-latest

    outputs:
      tests_generated: ${{ steps.generate.outputs.tests_generated }}
      generation_skipped: ${{ steps.generate.outputs.generation_skipped }}
      provider_states: ${{ steps.generate.outputs.provider_states }}
      consumers: ${{ steps.generate.outputs.consumers }}
      output_path: ${{ steps.generate.outputs.output_path }}
      resolved_provider_name: ${{ steps.resolve-name.outputs.provider_name }}

    steps:
      - name: Checkout central repo
        uses: actions/checkout@v4
        with:
          repository: KalpitaG/ai-contract-testing-demo
          token: ${{ secrets.PAT_TOKEN }}
          path: ai-contract-testing

      - name: Checkout provider repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          token: ${{ secrets.PAT_TOKEN }}
          path: provider-repo
          fetch-depth: 0

      # -------------------------------------------------------------------
      # AD-4: Resolve provider name
      #   - If input is non-empty → use it (webhook case, Pactflow is authoritative)
      #   - Else → read .contract-testing.yml from checked-out provider repo
      #   - Else → fall back to repo name
      # -------------------------------------------------------------------
      - name: Resolve Provider Name
        id: resolve-name
        run: |
          if [ -n "${{ inputs.provider_name }}" ]; then
            echo "provider_name=${{ inputs.provider_name }}" >> $GITHUB_OUTPUT
            echo "Source: workflow input (webhook payload)"
          elif [ -f "provider-repo/.contract-testing.yml" ]; then
            NAME=$(python3 -c "
          import yaml, sys
          with open('provider-repo/.contract-testing.yml') as f:
              config = yaml.safe_load(f)
          name = (config or {}).get('pactflow_name', '').strip()
          print(name)
            " 2>/dev/null || echo "")
            if [ -n "$NAME" ]; then
              echo "provider_name=$NAME" >> $GITHUB_OUTPUT
              echo "Source: .contract-testing.yml (pactflow_name=$NAME)"
            else
              REPO_NAME=$(echo "${{ inputs.repository }}" | cut -d'/' -f2)
              echo "provider_name=$REPO_NAME" >> $GITHUB_OUTPUT
              echo "Source: repository name fallback (pactflow_name was empty in config)"
            fi
          else
            REPO_NAME=$(echo "${{ inputs.repository }}" | cut -d'/' -f2)
            echo "provider_name=$REPO_NAME" >> $GITHUB_OUTPUT
            echo "Source: repository name fallback (no .contract-testing.yml found)"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-contract-testing/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r ai-contract-testing/requirements.txt

      - name: Post Starting Comment
        if: inputs.pr_number != 0
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh pr comment ${{ inputs.pr_number }} --repo ${{ inputs.repository }} --body \
            "## Provider Verification Starting

            **Provider:** \`${{ steps.resolve-name.outputs.provider_name }}\`

            Steps:
            1. Fetching pacts from Pactflow
            2. Analyzing provider code
            3. AI generating state handlers
            4. Running verification

            ---
            *— AI Contract Testing*"

      - name: Generate Provider Tests
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PACTFLOW_TOKEN: ${{ secrets.PACTFLOW_TOKEN }}
          PACTFLOW_BASE_URL: ${{ secrets.PACTFLOW_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: https://cloud.langfuse.com
        run: |
          cd ai-contract-testing

          # Run provider generator (import from src.provider)
          python -c "
          import json
          import os
          import sys

          from src.provider.provider_generator import generate_provider_tests

          result = generate_provider_tests(
              provider_name='${{ steps.resolve-name.outputs.provider_name }}',
              provider_repo_path='../provider-repo',
              output_dir='../provider-repo/tests/contract-verification',
              pact_url='${{ inputs.pact_url }}' or None
          )

          # Write outputs
          with open('../generation-result.json', 'w') as f:
              json.dump({
                  'success': result.success,
                  'output_path': result.output_path,
                  'provider_states': result.provider_states,
                  'consumers': result.consumers,
                  'quality_score': result.quality_score,
                  'error': result.error,
                  'generation_skipped': result.generation_skipped
              }, f)

          if not result.success:
              print(f'Generation failed: {result.error}')
              sys.exit(1)

          print(f'Generated: {result.output_path}')
          print(f'States: {result.provider_states}')
          print(f'Quality: {result.quality_score}/10')
          "

          # Read results and set outputs
          if [ -f "../generation-result.json" ]; then
            echo "tests_generated=$(jq -r '.success' ../generation-result.json)" >> $GITHUB_OUTPUT
            echo "generation_skipped=$(jq -r '.generation_skipped' ../generation-result.json)" >> $GITHUB_OUTPUT
            echo "provider_states=$(jq -c '.provider_states' ../generation-result.json)" >> $GITHUB_OUTPUT
            echo "consumers=$(jq -c '.consumers' ../generation-result.json)" >> $GITHUB_OUTPUT
            echo "output_path=$(jq -r '.output_path' ../generation-result.json)" >> $GITHUB_OUTPUT
          else
            echo "tests_generated=false" >> $GITHUB_OUTPUT
            echo "generation_skipped=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Generated Tests
        if: steps.generate.outputs.tests_generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: provider-tests
          path: provider-repo/tests/contract-verification/
          retention-days: 1

  # =====================================================================
  # STEP 2: Run Provider Verification
  # =====================================================================
  run-verification:
    name: Run Provider Verification
    needs: generate-provider-tests
    if: needs.generate-provider-tests.outputs.tests_generated == 'true'
    runs-on: ubuntu-latest

    outputs:
      verification_passed: ${{ steps.verify.outputs.passed }}
      verification_error: ${{ steps.verify.outputs.error }}

    steps:
      - name: Checkout provider repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Download Generated Tests
        uses: actions/download-artifact@v4
        with:
          name: provider-tests
          path: tests/contract-verification/

      - name: Display Generated Code
        run: |
          echo "=========================================="
          echo "📄 AI-GENERATED PROVIDER TEST CODE"
          echo "=========================================="
          for f in tests/contract-verification/*; do
            echo ""
            echo "--- FILE: $f ---"
            cat "$f"
            echo ""
            echo "--- END: $f ---"
          done
          echo "=========================================="

      - name: Read Server Config
        id: server-config
        run: |
          # Read port and health path from .contract-testing.yml if present
          if [ -f ".contract-testing.yml" ]; then
            PORT=$(python3 -c "
          import yaml
          with open('.contract-testing.yml') as f:
              cfg = yaml.safe_load(f) or {}
          print(cfg.get('server', {}).get('port', 3001))
            " 2>/dev/null || echo "3001")
            HEALTH=$(python3 -c "
          import yaml
          with open('.contract-testing.yml') as f:
              cfg = yaml.safe_load(f) or {}
          print(cfg.get('server', {}).get('health_path', '/health'))
            " 2>/dev/null || echo "/health")
          else
            PORT=3001
            HEALTH=/health
          fi
          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "health_path=$HEALTH" >> $GITHUB_OUTPUT
          echo "Server config: port=$PORT, health_path=$HEALTH"

      - name: Detect Runtime
        id: detect-runtime
        run: |
          if [ -f "package.json" ]; then
            echo "runtime=node" >> $GITHUB_OUTPUT
            if [ -f "package-lock.json" ]; then
              echo "install_cmd=npm ci" >> $GITHUB_OUTPUT
            else
              echo "install_cmd=npm install" >> $GITHUB_OUTPUT
            fi
            echo "start_cmd=npm start" >> $GITHUB_OUTPUT
            # Use npx jest directly — never depend on package.json scripts
            echo "verify_cmd=npx jest tests/contract-verification/ --forceExit --no-cache" >> $GITHUB_OUTPUT
          elif [ -f "go.mod" ]; then
            echo "runtime=go" >> $GITHUB_OUTPUT
            echo "install_cmd=go mod download" >> $GITHUB_OUTPUT
            echo "start_cmd=go run . &" >> $GITHUB_OUTPUT
            echo "verify_cmd=go test ./tests/..." >> $GITHUB_OUTPUT
          elif [ -f "requirements.txt" ]; then
            echo "runtime=python" >> $GITHUB_OUTPUT
            echo "install_cmd=pip install -r requirements.txt" >> $GITHUB_OUTPUT
            echo "start_cmd=python -m flask run &" >> $GITHUB_OUTPUT
            echo "verify_cmd=pytest tests/contract-verification/" >> $GITHUB_OUTPUT
          else
            echo "runtime=node" >> $GITHUB_OUTPUT
            echo "install_cmd=npm install" >> $GITHUB_OUTPUT
            echo "start_cmd=npm start" >> $GITHUB_OUTPUT
            echo "verify_cmd=npx jest tests/contract-verification/ --forceExit --no-cache" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.detect-runtime.outputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        if: steps.detect-runtime.outputs.runtime == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Python
        if: steps.detect-runtime.outputs.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: ${{ steps.detect-runtime.outputs.install_cmd }}

      - name: Start Provider Server
        id: start-server
        run: |
          # Start server in background
          ${{ steps.detect-runtime.outputs.start_cmd }} &
          SERVER_PID=$!
          echo "server_pid=$SERVER_PID" >> $GITHUB_OUTPUT

          PORT=${{ steps.server-config.outputs.port }}
          HEALTH=${{ steps.server-config.outputs.health_path }}

          # Wait for server to be ready
          echo "Waiting for server on http://localhost:${PORT}${HEALTH}..."
          for i in {1..30}; do
            if curl -s "http://localhost:${PORT}${HEALTH}" > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            echo "Attempt $i: Server not ready, waiting..."
            sleep 2
          done

          # Final check
          if ! curl -s "http://localhost:${PORT}${HEALTH}" > /dev/null 2>&1; then
            echo "Server failed to start on port ${PORT}"
            exit 1
          fi

      - name: Run Verification
        id: verify
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACTFLOW_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACTFLOW_TOKEN }}
          PACTFLOW_BASE_URL: ${{ secrets.PACTFLOW_BASE_URL }}
          PACTFLOW_TOKEN: ${{ secrets.PACTFLOW_TOKEN }}
          PACT_URL: ${{ inputs.pact_url }}
          PACT_PROVIDER: ${{ needs.generate-provider-tests.outputs.resolved_provider_name }}
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI: true
        run: |
          echo "Running provider verification..."
          echo "Provider: $PACT_PROVIDER"
          echo "Broker: $PACT_BROKER_BASE_URL"

          # Run verification and capture full output for breaking change analysis
          set +e
          ${{ steps.detect-runtime.outputs.verify_cmd }} 2>&1 | tee verification-output.txt
          VERIFY_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $VERIFY_EXIT_CODE -eq 0 ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "✅ Verification PASSED"
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "error=Verification failed - provider does not satisfy consumer contracts" >> $GITHUB_OUTPUT
            echo "❌ Verification FAILED"
          fi

      - name: Upload Verification Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-output
          path: verification-output.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop Provider Server
        if: always()
        run: |
          pkill -f "node src/index" || true
          pkill -f "npm start" || true
          pkill -f "go run" || true
          pkill -f "flask run" || true

  # =====================================================================
  # STEP 3: Analyze Breaking Changes (if verification failed)
  # =====================================================================
  analyze-breaking-changes:
    name: Analyze Breaking Changes
    needs: [generate-provider-tests, run-verification]
    if: needs.run-verification.outputs.verification_passed == 'false'
    runs-on: ubuntu-latest

    outputs:
      analysis_complete: ${{ steps.analyze.outputs.analysis_complete }}
      is_breaking_change: ${{ steps.analyze.outputs.is_breaking_change }}

    steps:
      - name: Checkout central repo
        uses: actions/checkout@v4
        with:
          repository: KalpitaG/ai-contract-testing-demo
          token: ${{ secrets.PAT_TOKEN }}
          path: ai-contract-testing

      - name: Checkout provider repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          token: ${{ secrets.PAT_TOKEN }}
          path: provider-repo

      - name: Download Verification Output
        uses: actions/download-artifact@v4
        with:
          name: verification-output
          path: .

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-contract-testing/requirements.txt

      - name: Install Python dependencies
        run: pip install -r ai-contract-testing/requirements.txt

      - name: Run Breaking Change Analysis
        id: analyze
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PACTFLOW_TOKEN: ${{ secrets.PACTFLOW_TOKEN }}
          PACTFLOW_BASE_URL: ${{ secrets.PACTFLOW_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: https://cloud.langfuse.com
        run: |
          cd ai-contract-testing

          python -c "
          import json
          import os
          import sys

          from src.provider.breaking_change_agent import BreakingChangeAgent
          from src.provider.pact_fetcher import PactFetcher
          from src.provider.provider_analyzer import ProviderAnalyzer

          # Read verification output
          output_file = '../verification-output.txt'
          if os.path.exists(output_file):
              with open(output_file) as f:
                  verification_output = f.read()
          else:
              verification_output = 'No verification output captured'
              print('Warning: verification-output.txt not found')

          provider_name = '${{ needs.generate-provider-tests.outputs.resolved_provider_name }}'
          pact_url = '${{ inputs.pact_url }}' or None

          # Fetch pact context
          try:
              fetcher = PactFetcher()
              pact_context = fetcher.fetch_provider_pacts(provider_name, pact_url=pact_url)
          except Exception as e:
              print(f'Could not fetch pact context: {e}')
              pact_context = None

          # Analyze provider code
          try:
              analyzer = ProviderAnalyzer('../provider-repo')
              provider_context = analyzer.analyze()
          except Exception as e:
              print(f'Could not analyze provider: {e}')
              provider_context = None

          # Run breaking change analysis
          if pact_context and provider_context:
              agent = BreakingChangeAgent()
              analysis = agent.analyze(
                  verification_output=verification_output,
                  pact_context=pact_context,
                  provider_context=provider_context,
                  provider_name=provider_name
              )

              # Format comment
              comment = agent.format_github_comment(analysis)

              # Write outputs
              with open('../analysis-result.json', 'w') as f:
                  json.dump({
                      'is_breaking_change': analysis.is_breaking_change,
                      'is_test_code_error': analysis.is_test_code_error,
                      'summary': analysis.summary,
                      'num_changes': len(analysis.changes),
                      'num_fix_options': len(analysis.fix_options),
                  }, f)

              with open('../analysis-comment.md', 'w') as f:
                  f.write(comment)

              print(f'Analysis complete: breaking_change={analysis.is_breaking_change}')
              print(f'Changes: {len(analysis.changes)}, Fix options: {len(analysis.fix_options)}')
          else:
              print('Skipping analysis: missing pact or provider context')
              with open('../analysis-comment.md', 'w') as f:
                  f.write('## Verification Failed\n\nCould not run breaking change analysis due to missing context.\nCheck the workflow logs for details.\n\n---\n*AI Contract Testing*')
              with open('../analysis-result.json', 'w') as f:
                  json.dump({'is_breaking_change': False, 'is_test_code_error': False, 'summary': 'Analysis skipped'}, f)
          "

          # Set outputs
          if [ -f "../analysis-result.json" ]; then
            echo "analysis_complete=true" >> $GITHUB_OUTPUT
            IS_BC=$(jq -r '.is_breaking_change' ../analysis-result.json)
            echo "is_breaking_change=$IS_BC" >> $GITHUB_OUTPUT
          else
            echo "analysis_complete=false" >> $GITHUB_OUTPUT
            echo "is_breaking_change=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Analysis Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breaking-change-analysis
          path: |
            analysis-result.json
            analysis-comment.md
          retention-days: 7
          if-no-files-found: ignore

  # =====================================================================
  # STEP 4: Report Results
  # =====================================================================
  report-results:
    name: Report Results
    needs: [generate-provider-tests, run-verification, analyze-breaking-changes, persist-handlers]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download Analysis Comment
        if: needs.analyze-breaking-changes.outputs.analysis_complete == 'true'
        uses: actions/download-artifact@v4
        with:
          name: breaking-change-analysis
          path: analysis/
        continue-on-error: true

      - name: Comment - Generation Failed
        if: needs.generate-provider-tests.outputs.tests_generated != 'true' && inputs.pr_number != 0
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh pr comment ${{ inputs.pr_number }} --repo ${{ inputs.repository }} --body \
            "## ❌ Provider Test Generation Failed

            **Provider:** \`${{ needs.generate-provider-tests.outputs.resolved_provider_name }}\`

            Could not generate state handlers. Possible reasons:
            - No pacts found in Pactflow for this provider
            - AI generation error
            - Provider code analysis failed

            Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

            ---
            *— AI Contract Testing*"

      - name: Comment - Verification Passed
        if: needs.run-verification.outputs.verification_passed == 'true' && inputs.pr_number != 0
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          STATES='${{ needs.generate-provider-tests.outputs.provider_states }}'
          CONSUMERS='${{ needs.generate-provider-tests.outputs.consumers }}'

          gh pr comment ${{ inputs.pr_number }} --repo ${{ inputs.repository }} --body \
            "## ✅ Provider Verification Passed

            **Provider:** \`${{ needs.generate-provider-tests.outputs.resolved_provider_name }}\`
            **Consumers:** $CONSUMERS
            **States verified:** $STATES

            All consumer contracts are satisfied. Results have been published to Pactflow.

            ---
            *— AI Contract Testing*"

      - name: Comment - Verification Failed (with analysis)
        if: needs.run-verification.outputs.verification_passed == 'false' && inputs.pr_number != 0
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Use the breaking change analysis comment if available
          if [ -f "analysis/analysis-comment.md" ]; then
            COMMENT=$(cat analysis/analysis-comment.md)
          else
            STATES='${{ needs.generate-provider-tests.outputs.provider_states }}'
            CONSUMERS='${{ needs.generate-provider-tests.outputs.consumers }}'
            ERROR='${{ needs.run-verification.outputs.verification_error }}'

            COMMENT="## ❌ Provider Verification Failed

            **Provider:** \`${{ needs.generate-provider-tests.outputs.resolved_provider_name }}\`
            **Consumers:** $CONSUMERS
            **States:** $STATES

            **Error:** $ERROR

            The provider does not satisfy all consumer contracts.

            **Next steps:**
            1. Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for specific failures
            2. Update provider to satisfy the contracts
            3. Or negotiate contract changes with consumers

            ---
            *— AI Contract Testing*"
          fi

          # Post the comment (use heredoc for multi-line markdown)
          gh pr comment ${{ inputs.pr_number }} --repo ${{ inputs.repository }} --body "$COMMENT"

      - name: Write Job Summary (webhook / no PR)
        if: inputs.pr_number == 0
        run: |
          echo "## Provider Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PROVIDER='${{ needs.generate-provider-tests.outputs.resolved_provider_name }}'
          echo "**Provider:** \`$PROVIDER\`" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.run-verification.outputs.verification_passed }}" = "true" ]; then
            echo "**Result:** Verification PASSED" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.generate-provider-tests.outputs.tests_generated }}" != "true" ]; then
            echo "**Result:** Test generation failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Result:** Verification FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            # Include breaking change analysis in job summary
            if [ -f "analysis/analysis-comment.md" ]; then
              cat analysis/analysis-comment.md >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Comment on Handler PR
        if: needs.persist-handlers.outputs.handler_pr_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          HANDLER_PR='${{ needs.persist-handlers.outputs.handler_pr_number }}'
          REPO='${{ inputs.repository }}'
          PROVIDER='${{ needs.generate-provider-tests.outputs.resolved_provider_name }}'
          CONSUMERS='${{ needs.generate-provider-tests.outputs.consumers }}'
          STATES='${{ needs.generate-provider-tests.outputs.provider_states }}'
          VERIFICATION='${{ needs.run-verification.outputs.verification_passed }}'

          if [ "$VERIFICATION" = "true" ]; then
            gh pr comment "$HANDLER_PR" --repo "$REPO" --body "$(cat <<'EOF'
          ## ✅ Provider Verification Passed

          **Provider:** `'"$PROVIDER"'`
          **Consumer(s):** '"$CONSUMERS"'
          **States verified:** '"$STATES"'

          All consumer contracts are satisfied. Review the generated handlers and merge when ready.

          ---
          *— AI Contract Testing*
          EOF
          )"
          elif [ -f "analysis/analysis-comment.md" ]; then
            # Post the breaking change analysis on the handler PR
            COMMENT=$(cat analysis/analysis-comment.md)
            gh pr comment "$HANDLER_PR" --repo "$REPO" --body "$COMMENT"
          else
            gh pr comment "$HANDLER_PR" --repo "$REPO" --body "$(cat <<'EOF'
          ## ❌ Provider Verification Failed

          **Provider:** `'"$PROVIDER"'`
          **Consumer(s):** '"$CONSUMERS"'
          **States:** '"$STATES"'

          The provider does not satisfy all consumer contracts. Check the workflow logs for details.

          Use \`ai-revise: <feedback>\` to request changes to the generated handlers.

          ---
          *— AI Contract Testing*
          EOF
          )"
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: |
            generation-result.json
          retention-days: 7

  # =====================================================================
  # STEP 5: Persist Handlers to Provider Repo (3.2)
  # =====================================================================
  persist-handlers:
    name: Persist Handlers to Provider Repo
    needs: [generate-provider-tests, run-verification]
    if: |
      always() &&
      inputs.pr_number != 0 &&
      needs.generate-provider-tests.outputs.tests_generated == 'true' &&
      needs.generate-provider-tests.outputs.generation_skipped != 'true'
    runs-on: ubuntu-latest

    outputs:
      handler_pr_number: ${{ steps.create-pr.outputs.handler_pr_number }}

    steps:
      - name: Checkout provider repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          token: ${{ secrets.PAT_TOKEN }}
          path: provider-repo
          fetch-depth: 0

      - name: Download Generated Tests
        uses: actions/download-artifact@v4
        with:
          name: provider-tests
          path: provider-tests/

      - name: Create Handler PR
        id: create-pr
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          cd provider-repo

          PROVIDER='${{ needs.generate-provider-tests.outputs.resolved_provider_name }}'
          PR_NUM='${{ inputs.pr_number }}'
          VERIFICATION='${{ needs.run-verification.outputs.verification_passed }}'
          REPO='${{ inputs.repository }}'
          CONSUMERS='${{ needs.generate-provider-tests.outputs.consumers }}'
          STATES='${{ needs.generate-provider-tests.outputs.provider_states }}'

          # Determine branch name and target
          if [ "$PR_NUM" != "0" ] && [ -n "$PR_NUM" ]; then
            # PR trigger: target the feature branch
            PR_INFO=$(gh pr view "$PR_NUM" --repo "$REPO" --json headRefName,title)
            TARGET_BRANCH=$(echo "$PR_INFO" | jq -r '.headRefName')
            FEATURE_TITLE=$(echo "$PR_INFO" | jq -r '.title')
            HANDLER_BRANCH="contract-handlers/pr-${PR_NUM}"
            TRIGGER_TYPE="PR #${PR_NUM}"
          else
            # Webhook trigger: target main
            TARGET_BRANCH="main"
            FEATURE_TITLE=""
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            HANDLER_BRANCH="contract-handlers/auto-${SHORT_SHA}"
            TRIGGER_TYPE="webhook"
          fi

          echo "Target branch: $TARGET_BRANCH"
          echo "Handler branch: $HANDLER_BRANCH"
          echo "Trigger: $TRIGGER_TYPE"

          # Check if handler PR already exists
          EXISTING_PR=$(gh pr list --repo "$REPO" --head "$HANDLER_BRANCH" --json number -q '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "Handler PR #${EXISTING_PR} already exists, updating..."
            git fetch origin "$HANDLER_BRANCH" 2>/dev/null || true
            git checkout -B "$HANDLER_BRANCH" "origin/${HANDLER_BRANCH}" 2>/dev/null || git checkout -b "$HANDLER_BRANCH"
          else
            # Create new branch from target
            git fetch origin "$TARGET_BRANCH" 2>/dev/null || true
            git checkout -B "$HANDLER_BRANCH" "origin/${TARGET_BRANCH}" 2>/dev/null || git checkout -b "$HANDLER_BRANCH"
          fi

          # Copy generated handlers into the repo
          mkdir -p tests/contract-verification
          cp -r ../provider-tests/* tests/contract-verification/

          # Commit
          git add tests/contract-verification/
          git config user.name "AI Contract Testing Bot"
          git config user.email "ai-contract-testing@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes to commit (handlers unchanged)"
            exit 0
          fi

          VERIFY_STATUS="PASSED"
          if [ "$VERIFICATION" != "true" ]; then
            VERIFY_STATUS="FAILED"
          fi

          git commit -m "AI: Add provider state handlers for ${PROVIDER}

          Provider: ${PROVIDER}
          Verification: ${VERIFY_STATUS}
          Trigger: ${TRIGGER_TYPE}
          Generated by AI Contract Testing"

          git push origin "$HANDLER_BRANCH" --force

          # Create PR if it doesn't exist
          if [ -z "$EXISTING_PR" ]; then
            # Count number of states
            STATE_COUNT=$(echo "$STATES" | python3 -c "import sys,json; print(len(json.loads(sys.stdin.read())))" 2>/dev/null || echo "N/A")

            # Build PR title with feature context
            if [ -n "$FEATURE_TITLE" ]; then
              PR_TITLE="AI State Handlers — ${FEATURE_TITLE} (#${PR_NUM})"
            else
              PR_TITLE="AI State Handlers — ${PROVIDER}"
            fi

            PR_URL=$(gh pr create \
              --repo "$REPO" \
              --head "$HANDLER_BRANCH" \
              --base "$TARGET_BRANCH" \
              --title "$PR_TITLE" \
              --body "$(cat <<PREOF
          ## AI-Generated Provider State Handlers

          **Provider:** \`${PROVIDER}\`
          **Consumer(s):** ${CONSUMERS}
          **States covered:** ${STATE_COUNT}
          **Verification result:** ${VERIFY_STATUS}
          **Trigger:** ${TRIGGER_TYPE}

          ### What's included
          - State handler file(s) in \`tests/contract-verification/\`
          - All state handlers needed for consumer contract verification

          ### What to do
          1. Review the generated state handlers
          2. Merge this PR into your branch
          3. Future verifications will use these committed handlers (no AI regeneration needed)

          ---
          *— AI Contract Testing*
          PREOF
          )")
            echo "Created handler PR: $PR_URL"

            # Extract PR number from URL (e.g., https://github.com/owner/repo/pull/123)
            HANDLER_PR_NUM=$(echo "$PR_URL" | grep -o '[0-9]*$' || echo "")
            echo "handler_pr_number=$HANDLER_PR_NUM" >> $GITHUB_OUTPUT
          else
            echo "Updated existing handler PR #${EXISTING_PR}"
            echo "handler_pr_number=${EXISTING_PR}" >> $GITHUB_OUTPUT
          fi
